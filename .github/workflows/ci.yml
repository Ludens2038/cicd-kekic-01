name: CI
on:
  push:
    branches: [ main ]
    paths: [ 'Dockerfile', '.dockerignore', 'pom.xml', 'src/**', '.github/workflows/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'Dockerfile', '.dockerignore', 'pom.xml', 'src/**', '.github/workflows/**' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    needs: sonar
    name: "Test (${{ matrix.os }} / Java ${{ matrix.java }})"
    strategy:
      fail-fast: true
      matrix:
        os:   [ubuntu-latest, windows-latest]
        java: [17, 21]
        exclude:
          - os: windows-latest
            java: 21
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build & Test
        run: mvn -B -DskipTests=false test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-java${{ matrix.java }}
          path: target/surefire-reports

  sonar:
    name: "sonar"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & Test (with coverage)
        run: mvn -B -DskipTests=false test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Upload JaCoCo HTML (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-site
          path: target/site/jacoco

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # explicit params if auto-detect fails:
          # projectKey: your_org_your_project
          # organization: your_org
          # einfach nur ein kommentar
          args: >
             -Dsonar.projectKey=Ludens2038_cicd-kekic-01
             -Dsonar.organization=ludens2038
             -Dsonar.branch.name=main  
             -Dsonar.java.binaries=target/classes
             -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  docker-build-artifact:
    needs: build-test
    name: "docker"
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (warm up Maven cache for build stage)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # Build single-platform image and load into the Docker engine (required for docker save)
      - name: Build (load to engine)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local/app:${{ steps.vars.outputs.short_sha }}

      # Save the image to a tarball named with the commit SHA
      - name: Save image as artifact tar
        run: docker save -o image-${{ steps.vars.outputs.short_sha }}.tar local/app:${{ steps.vars.outputs.short_sha }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.vars.outputs.short_sha }}
          path: image-${{ steps.vars.outputs.short_sha }}.tar
          retention-days: 7

  Vulnerability_Scan_Trivy:
    runs-on: ubuntu-latest
    needs: docker-build-artifact
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.docker-build-artifact.outputs.short_sha }}

      - name: Load docker image from artifact
        run: docker load -i image-${{ needs.docker-build-artifact.outputs.short_sha }}.tar

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: local/app:${{ needs.docker-build-artifact.outputs.short_sha }}
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: 0

      - name: Trivy Image Scan (JSON Report)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: local/app:${{ needs.docker-build-artifact.outputs.short_sha }}
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          format: 'json'                    # <-- wichtig
          output: 'trivy-image-report.json' # <-- wird im Workspace erzeugt
          exit-code: 0                     

      - name: Upload Trivy JSON Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          retention-days: 7

      - name: Scan IaC
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          scan-type: 'config'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: 0

  Vulnerability_Scan_Grype:
    runs-on: ubuntu-latest
    needs: docker-build-artifact
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ needs.docker-build-artifact.outputs.short_sha }}

      - name: Load docker image from artifact
        run: docker load -i image-${{ needs.docker-build-artifact.outputs.short_sha }}.tar

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype version

      - name: Scan Docker Image
        continue-on-error: true
        run: |
          grype local/app:${{ needs.docker-build-artifact.outputs.short_sha }} -q

      - name: Grype Image Scan (JSON Report)
        run: |
          grype local/app:${{ needs.docker-build-artifact.outputs.short_sha }} \
            -o json > grype-image-report.json

      - name: Upload Grype JSON Report
        uses: actions/upload-artifact@v4
        with:
          name: grype-image-report
          path: grype-image-report.json
          retention-days: 7

      - name: Grype Filesystem Scan (optional)
        continue-on-error: true
        run: |
          grype dir:. -q

      - name: Grype Filesystem Scan (JSON, optional)
        run: |
          grype dir:. -o json > grype-fs-report.json

      - name: Upload Grype FS JSON Report (optional)
        uses: actions/upload-artifact@v4
        with:
          name: grype-fs-report
          path: grype-fs-report.json
          retention-days: 7